<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order - Art Dictionary Luxury</title>
</head>
<body style="background-color: rgb(248, 201, 131); font-family: Arial, sans-serif;">

    <h1 style="background-color: rgb(212, 117, 8); padding:10px; color:white; text-align:center;">PLACE YOUR ORDER</h1>
    
    <div style="max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 15px;">
        <h2>Art Dictionary Luxury - Order Form</h2>
        <p>Fill this form to order your luxury painting or sculpture.</p>
        
        <form action="#" method="post">
            <label>Full Name:</label><br>
            <input type="text" name="name" required style="width:100%; padding:10px; margin:8px 0; border-radius:5px; border:1px solid #ccc;"><br>

            <label>Phone Number:</label><br>
            <input type="tel" name="phone" required placeholder="0549996895" style="width:100%; padding:10px; margin:8px 0; border-radius:5px; border:1px solid #ccc;"><br>

            <label>Email:</label><br>
            <input type="email" name="email" required style="width:100%; padding:10px; margin:8px 0; border-radius:5px; border:1px solid #ccc;"><br>

            <label>Artwork Type:</label><br>
            <select name="artwork" style="width:100%; padding:10px; margin:8px 0; border-radius:5px; border:1px solid #ccc;">
                <option>Textured Painting</option>
                <option>Sculptural Wall Art</option>
                <option>Custom Portrait</option>
                <option>Luxury Canvas</option>
                <option>Office/Hotel Decoration</option>
            </select><br>

            <label>Size / Specifications:</label><br>
            <input type="text" name="size" placeholder="e.g. 60x80cm, Beige and Jade colors" style="width:100%; padding:10px; margin:8px 0; border-radius:5px; border:1px solid #ccc;"><br>

            <label>Order Details:</label><br>
            <textarea name="details" rows="5" placeholder="Describe what you want..." style="width:100%; padding:10px; margin:8px 0; border-radius:5px; border:1px solid #ccc;"></textarea><br>

            <button type="submit" style="background-color: rgb(212, 117, 8); color: white; padding: 12px 25px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; font-weight: bold;">
                Submit Order
            </button>
        </form>

        <br>
        <a href="index.html" style="text-decoration: none; color: rgb(212, 117, 8); font-weight: bold;">← Back to Home</a>
        
        <hr>
        <p><b>Contact:</b> Richard Owusu | 0549996895 | richardowus2050@gmail.com</p>
        <p><b>Location:</b> 41 Nii Afrotse St, Accra</p>
    </div>

</body>
</html>
